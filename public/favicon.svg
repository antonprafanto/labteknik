<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <!-- Flask icon -->
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flask body -->
    <path d="M35 25 L35 45 L25 75 C23 80 26 85 32 85 L68 85 C74 85 77 80 75 75 L65 45 L65 25"/>
    <!-- Flask top -->
    <line x1="30" y1="25" x2="70" y2="25"/>
    <!-- Liquid level -->
    <path d="M30 65 L70 65" stroke-dasharray="4 3"/>
    <!-- Bubbles -->
    <circle cx="45" cy="72" r="3" fill="white" stroke="none"/>
    <circle cx="55" cy="68" r="2" fill="white" stroke="none"/>
    <circle cx="50" cy="78" r="2.5" fill="white" stroke="none"/>
